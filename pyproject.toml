[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bentoniggy-quantize_jd390"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对量化与稀疏化研究员·注意力核��的访存瓶颈相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bentoniggy" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bentoniggy.github.io"
Repository = "https://github.com/bentoniggy/quantize_jd390"
Issues = "https://github.com/bentoniggy/quantize_jd390/issues"

[project.scripts]
quantize_jd390 = "quantize_jd390:main"

[tool.setuptools]
py-modules = ["quantize_jd390"]
